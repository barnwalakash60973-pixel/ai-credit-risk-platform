[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-scoring-platform"
version = "0.1.0"
description = "AI Credit Risk Scoring Platform - Medallion Architecture with XGBoost, SHAP, RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "cryptography>=41.0",
    "boto3>=1.34",
    "kaggle>=1.6",
    "faker>=21.0",
    "pyspark>=3.5",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "duckdb>=0.10",
    "shap>=0.44",
    "mlflow>=2.14,<4",
    "optuna>=3.5",
    "dbt-duckdb>=1.7",
    "chromadb>=0.4",
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "sentence-transformers>=2.2",
    "fastapi>=0.108",
    "uvicorn>=0.25",
    "streamlit>=1.50",
    "plotly>=5.18",
]

[project.optional-dependencies]
# Airflow is large and pins many transitive versions; install it with the official constraints file,
# or use the Docker image in docker/airflow/.
airflow = ["apache-airflow>=2.8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "black>=23.0", "ruff>=0.1", "mypy>=1.5"]

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true  # src/ has no __init__.py

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# Coverage is opt-in (`pytest --cov=src`) so a plain `pytest` works without pytest-cov installed.
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100