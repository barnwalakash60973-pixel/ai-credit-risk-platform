name: "credit_risk_platform"
version: "1.0.0"
config-version: 2

profile: "credit_risk_platform"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# PDPA: durable record of erased members. Created before any model runs so staging can
# anti-join it; a dbt rebuild from the Silver parquet can therefore never resurrect erased people.
on-run-start:
  - "create table if not exists main.erasure_registry (member_id_hash varchar, erased_at timestamp)"

models:
  credit_risk_platform:
    staging:
      +materialized: view
      +schema: staging